<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOL &middot; D&amp;D</title>
    <link rel="icon" href="./icon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0e0a05;
        color: #d4c49a;
      }
      #root { min-height: 100vh; }
      .boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse 70% 50% at 50% 28%, rgba(201,168,76,0.14), transparent 55%),
          radial-gradient(ellipse 50% 40% at 50% 100%, rgba(80,40,10,0.35), transparent 60%),
          #0e0a05;
        font-family: 'Crimson Text', Georgia, serif;
        text-align: center;
      }
      .boot__card {
        width: min(380px, 100%);
        padding: 40px 28px 32px;
        background:
          radial-gradient(ellipse 100% 60% at 50% 0%, rgba(201,168,76,0.1), transparent 55%),
          linear-gradient(180deg, #1a1208 0%, #110d06 100%);
        border: 1px solid rgba(201,168,76,0.35);
        box-shadow: 0 24px 60px rgba(0,0,0,0.65), inset 0 1px 0 rgba(232,201,106,0.08);
      }
      .boot__crest {
        display: block;
        margin: 0 auto 14px;
        width: 42px;
        height: 42px;
        border: 1.5px solid rgba(201,168,76,0.55);
        border-radius: 50%;
        color: #e8c96a;
        font-family: 'Cinzel', serif;
        font-size: 18px;
        font-weight: 700;
        line-height: 42px;
        letter-spacing: 0.5px;
        filter: drop-shadow(0 0 10px rgba(201,168,76,0.45));
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      .boot__title {
        margin: 0 0 6px;
        font-family: 'Cinzel', serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #f0d78c;
      }
      .boot__sub {
        margin: 0 0 28px;
        font-size: 15px;
        letter-spacing: 0.4px;
        color: rgba(212,196,154,0.65);
      }
      .boot__bar {
        height: 3px;
        border-radius: 2px;
        background: rgba(201,168,76,0.12);
        overflow: hidden;
      }
      .boot__bar > span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #c9a84c, #e8c96a, #c9a84c, transparent);
        animation: boot-slide 1.25s ease-in-out infinite;
      }
      .boot__status {
        margin: 16px 0 0;
        font-size: 13px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: rgba(201,168,76,0.75);
      }
      .boot--error .boot__crest { animation: none; color: #c96a6a; border-color: rgba(201,100,100,0.55); }
      .boot--error .boot__status { color: #c96a6a; text-transform: none; letter-spacing: 0.2px; }
      .boot--error .boot__bar > span { display: none; }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @keyframes boot-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.35); opacity: 1; }
        50% { box-shadow: 0 0 0 10px rgba(201,168,76,0); opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" id="boot" role="status" aria-live="polite">
        <div class="boot__card">
          <span class="boot__crest" aria-hidden="true">&#9824;</span>
          <h1 class="boot__title">LOL &middot; D&amp;D</h1>
          <p class="boot__sub">Preparando la campa&ntilde;a</p>
          <div class="boot__bar" aria-hidden="true"><span></span></div>
          <p class="boot__status" id="boot-status">Cargando cat&aacute;logos&hellip;</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
